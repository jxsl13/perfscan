version: 2

project_name: perfscanxx

# Monorepo release: both tools ship in ONE GitHub release per vX.Y.Z tag.
# This config builds the C++ analyzer; it appends its assets to the release the
# perfscan run created first (namespaced checksums, keep-existing mode).

builds:
  - id: perfscanxx
    main: .
    binary: perfscanxx
    env:
      - CGO_ENABLED=0 # pure Go — perfscanxx shells out to clang-tidy at runtime
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

release:
  mode: keep-existing
  footer: |
    ---
    perfscanxx orchestrates clang-tidy — install it at runtime (`brew install llvm`).

    Install perfscanxx with `go install github.com/jxsl13/perfscan/perfscanxx@{{.Tag}}`

changelog:
  disable: true # the perfscan run owns the combined release notes
