version: 2

project_name: perfscan

# Monorepo: this module lives in perfscan/ and is released on tags
# prefixed "perfscan/vX.Y.Z" (perfscanxx has its own "perfscanxx/vX.Y.Z").
monorepo:
  tag_prefix: perfscan/
  dir: perfscan

builds:
  - id: perfscan
    main: .
    binary: perfscan
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: New checks
      regexp: '^.*?feat\(check.*$'
      order: 0
    - title: Features
      regexp: '^.*?feat.*$'
      order: 1
    - title: Bug fixes
      regexp: '^.*?fix.*$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

release:
  footer: |
    ---
    Install with `go install github.com/jxsl13/perfscan/perfscan@{{.Tag}}`
