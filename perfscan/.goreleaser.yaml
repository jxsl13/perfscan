version: 2

project_name: perfscan

# Monorepo release: both tools ship in ONE GitHub release per vX.Y.Z tag.
# goreleaser (OSS) runs once per module, each in its own dir; this config builds
# the linter. The checksum filename is namespaced so the two runs don't collide,
# and release.mode keep-existing lets the second run add its assets to the
# release the first run created (release.yml serialises the two jobs).

builds:
  - id: perfscan
    main: .
    binary: perfscan
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

release:
  mode: keep-existing
  footer: |
    ---
    Install with `go install github.com/jxsl13/perfscan/perfscan@{{.Tag}}`

changelog:
  sort: asc
  groups:
    - title: New checks
      regexp: '^.*?feat\(check.*$'
      order: 0
    - title: Features
      regexp: '^.*?feat.*$'
      order: 1
    - title: Bug fixes
      regexp: '^.*?fix.*$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
