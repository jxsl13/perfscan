# perfscan domain-check vocabulary — a GENERIC template.
#
# perfscan's language/stdlib checks need no config and run on any Go module.
# The DOMAIN checks (opt-in) key on YOUR project's own vocabulary — the names of
# your element accessors, allocators, fast-path helpers, fan-out entry points and
# so on. List those names here so the domain checks can recognise them; leave any
# field empty (or omit it) to keep the checks that depend on it silent.
#
# Every value below is a PLACEHOLDER — replace it with the real identifiers from
# your codebase. Nothing here is built in; perfscan ships no vocabulary of its
# own. Supply this file with `-config perfscan.yaml`, or drop a perfscan.yaml /
# .perfscan.yaml in your module root (auto-discovered). YAML is the format; JSON
# also parses.
#
# The n-dimensional-data fields (shapeMethods, indexDecomposeFuncs, dtypeMethods)
# are only meaningful for tensor/array libraries — omit them otherwise.

# Optional human-readable metadata. It is accepted by the schema but never fed
# to an analyzer.
_comment: Replace every placeholder below with this repository's vocabulary.

# Target data-cache line size used by locality advisories. Omit for the
# conservative 64-byte default; Apple M-series CPUs use 128-byte cache lines.
cacheLineBytes: 128

# Per-element getter/setter methods whose per-call dispatch inside a hot loop the
# PS1xxx checks report. (matrix lib: At/Set — tensor lib: AtF64/SetF64)
elementAccessors:
  - At
  - Set

# Typed fast-path helpers whose presence marks a loop as already optimized, so a
# fallback per-element loop beside them is expected. Keep this list COMPLETE — a
# helper missing here makes the per-element checks flag the very fast path.
fastPathHelpers:
  - flatSlice
  - rawData

# Production selector helpers, default toggles, or selected kernel entry points
# whose use in a repeated leaf benchmark PS6006 audits. List only symbols whose
# promotion changes a production GPU/accelerator path; a finding asks for an
# order-alternating resident integration benchmark, not another leaf timing.
selectorPromotionSymbols:
  - selectKernel
  - useFusedAttention
  # Optional trusted caller-level promotion contract used by PS6054. Keep the
  # plain symbol above for other selector checks; quote contracts because they
  # contain YAML-significant punctuation.
  - "selectKernel=>BenchmarkPipelineEndToEnd|samples=10|independent|alternating|equivalent-outputs|retained-shapes<=0.5%"

# Methods whose result is used as a loop bound, marking the loop as per-element.
# (e.g. Len, Size, Count)
elementCountMethods:
  - Len

# Methods returning a dimension/shape slice; a loop bounded by x.Shape()[i] walks
# elements just as an element count does. (n-dimensional data only)
shapeMethods:
  - Shape

# Functions converting a flat index into a multi-index; their use marks a
# per-element loop. (n-dimensional data only)
indexDecomposeFuncs:
  - Unravel

# Allocation entry points that PS2001 reports when called inside a per-element
# loop. (e.g. New, Alloc, Zeros)
allocatorFuncs:
  - New
  - Alloc

# Helpers fed a per-element closure (one indirect call per element) that PS1002
# reports. (e.g. ForEach, Map, VisitEach)
perElementVisitors:
  - ForEach

# Bulk copy routines whose presence silences the genuine-decode path for PS4001.
# (e.g. a raw block copy)
bulkCopyHelpers:
  - bulkCopy

# SIMD / vectorized kernels that exist beside a scalar math.X call; PS4002 reports
# the scalar call when a vectorized sibling is available. (e.g. vExp, vTanh)
vectorizedSiblingFuncs:
  - vExp

# The project's parallel fan-out entry points. PS3xxx checks inspect serial
# work and closure escapes around them; PS6076 detects invariant packing
# repeated by every callback band. (e.g. parallel.For)
fanOutHelpers:
  - parallel.For

# Element-type discriminator methods whose switch PS1009 inspects for a case left
# on the per-element accessor while a sibling case takes typed storage.
# (n-dimensional data only; e.g. Dtype, Kind)
dtypeMethods:
  - Dtype

# Element type names of hot operation-result buffers. PS2140 flags an operation
# that allocates an input-sized []T result, fully overwrites it, and returns it
# (denying hot callers buffer reuse) and recommends a caller-owned Into variant.
# List the element types your hot kernels produce (e.g. float64, float32, or a
# named scalar type). Empty -> PS2140 stays silent.
outputBufferElemTypes:
  - float64
  - float32

# Constructor/bridge calls that build an EXPENSIVE compiled artifact (a graph,
# pipeline, shader, plan, kernel or executable). PS3091 flags a single-slot cache
# that recompiles whenever a stored signature changes (thrashing under
# alternating shapes); list the names so the check can tell a costly compile from
# cheap last-value memoization. Empty -> PS3091 stays silent.
compiledResourceFuncs:
  - compileGraph
  - newPipeline

# Entry-point names of GPU compute kernels (Metal) embedded as Go string literals
# that PS7001 should scan for a serial-K reduction — one thread per output row
# looping the whole reduction dimension with no SIMD-group cooperative reduction,
# which leaves lanes idle at batch M=1. The list is both opt-in and scope (only
# these kernels are inspected), because whether a serial reduction is wrong is
# shape/dtype/device-dependent. Empty -> PS7001 stays silent.
gpuReductionKernels:
  - matvec_q4k

# Helpers known to perform computation without changing tensor layout or
# ownership. Graph checks use short names to distinguish compute from movement.
# PS6090 additionally accepts exact typed IDs (import/path.Func or
# import/path.Type.Method) and audits that benchmark loops keep their primary
# non-error result observably live. Prefer exact IDs for that benchmark audit.
pureComputeFuncs:
  - forward
  - example.com/project/math.QMatMul

# Operation constants that represent layout/view or movement boundaries.
layoutOpConstants:
  - OpSlice
  - OpConcat

# Project types whose pointer identity or aliasing matters to ownership checks.
pointerTypeNames:
  - Tensor
  - Storage

# Variadic wrappers that submit their operands as one backend dispatch.
variadicDispatchWrappers:
  - exec

# Selectors that consume only a small ranked subset of a larger device result.
topKSelectorFuncs:
  - topKIndices

# Exact typed Top-K APIs whose k=1 result-use shape PS6091 may inspect. API IDs
# are import/path.Function or import/path.Type.Method strings. Set kind to
# function or method whenever both dotted parses are valid; it may be omitted
# only for an unambiguous legacy ID. Their import-
# path prefix follows Go's import-path rules; whitespace, control/non-ASCII and
# URL-ambiguous punctuation such as : @ % are invalid there, as are unqualified
# or empty-segment IDs. Receiver and function/method symbols are separately
# validated as Go identifiers and may therefore be Unicode. Hyphen, underscore
# and version path elements remain valid in the package path.
# Positions are one-based (so omissions are invalid) and exclude the receiver,
# including for method-expression calls. If no entry is valid, perfscan reports
# the vocabulary as missing. This only identifies the API layout: a scalar
# replacement still needs explicit prefix/tie/NaN/error equivalence.
topKOneContracts:
  - name: resident-topk-one
    function: example.com/project/backend.DeviceBuffer.TopKN
    kind: method
    kArgPosition: 2
    indicesResultPosition: 1

# Exact string-ownership boundaries for PS6110. Positions are one-based and
# exclude a method receiver. The candidate must locally acquire the native
# record pointer and count through this exact typed/cgo call, build the returned
# []record field from that count, and copy the configured direct native field
# into the configured direct string field with the same zero-based index.
# Every boolean is an explicit foreign-lifetime promise; names alone prove none
# of them. C.GoBytes/[]byte are intentionally unsupported because sharing fresh
# mutable results changes aliasing. PS6110 is advisory and never emits a fix.
# Version one requires these local out-arguments, an integer status guard, and
# a resolved external typed lifecycle; other acquisition/release modes wait for
# concrete owner APIs and separate proof coverage.
nativeSnapshotStringCopyContracts:
  - name: recorder-profile-labels
    candidateCallable: example.com/project/backend/metal.Recorder.Profile
    candidateKind: method
    destinationResultPosition: 1
    destinationSliceField: Events
    destinationStringField: Label
    acquireCallable: C.mtl_recorder_profile_snapshot
    acquireKind: cgo
    recordsOutArgumentPosition: 2
    countOutArgumentPosition: 3
    acquireStatusResultPosition: 1
    acquireSuccessInteger: 0
    nativeStringField: label
    copyKind: c-go-string
    copyPointerArgumentPosition: 1
    copyLengthArgumentPosition: 0
    copyStringResultPosition: 1
    lifecycleCallable: example.com/project/backend/metal.Recorder.Free
    lifecycleKind: method
    snapshotStableThroughCandidateReturn: true
    snapshotNotMutatedDuringExtraction: true
    extractionIsSynchronous: true
    copyReturnsExactOwnedString: true
    returnedStringsOutliveLifecycle: true
    exactContentCheckRequired: true

# Exact scheduler-to-microkernel tile contracts for PS6112. Version one uses
# package functions, one-based row arguments, and one explicit GOOS/GOARCH/tag
# regime per variant. The grain must resolve to exactly one positive integer
# constant in every regime. Each variant's exact tile router is either the
# kernel entry or one direct hop below it; the scalar row role is one-based.
# The booleans are reviewed project facts: names do not prove that the tiled
# kernel handles complete row tiles or that the scalar helper handles the
# remainder. At least two architectures are required. A final partial band
# remains valid and is not itself a finding. If the exact scheduling loop is
# inside a callback, also set synchronousRunner, its one-based work argument,
# and synchronousRunnerExecutesBeforeReturn; otherwise callback literals are
# ignored.
schedulerTileGrainContracts:
  - name: attention-forward-bands
    scheduler: example.com/project/backend.scheduleAttention
    grainConstant: example.com/project/backend.attentionBandRows
    band: example.com/project/backend.attentionBand
    bandRowsArgument: 3
    kernelEntry: example.com/project/backend.gemmRows
    kernelRowsArgument: 5
    repeatedFullTasks: true
    variants:
      - name: amd64-avx2
        goos: linux
        goarch: amd64
        tileHeight: 6
        tileRouter: example.com/project/backend.gemmRows
        tileRouterRowsArgument: 5
        tiledKernel: example.com/project/backend.gemmTile6x16AVX2
        scalarFallback: example.com/project/backend.gemmRowsScalar
        scalarFallbackRowsArgument: 5
        kernelEntryRoutesFullTiles: true
        scalarFallbackHandlesTileRemainder: true
      - name: apple-arm64-simd
        goos: darwin
        goarch: arm64
        buildTags:
          - goexperiment.simd
        tileHeight: 4
        tileRouter: example.com/project/backend.gemmRowsNeon
        tileRouterRowsArgument: 6
        tiledKernel: example.com/project/backend.gemmTile4x16Neon
        scalarFallback: example.com/project/backend.gemmRowsScalar
        scalarFallbackRowsArgument: 5
        kernelEntryRoutesFullTiles: true
        scalarFallbackHandlesTileRemainder: true

# Helpers exposing typed input views and caller-owned output views.
inputViewFuncs:
  - f64Data
outputViewFuncs:
  - outF64

# Reference backend package and optimized production backend packages.
referenceBackendPkg: ref
optimizedBackendPkgs:
  - cpu

# Functions that register operation/dtype/backend implementations.
kernelRegisterFuncs:
  - registerKernel

# Exact API contracts for PS6087 last-use in-place fusion candidates. Function
# IDs are import/path.Type.Method. These booleans are semantic promises made by
# the project, not facts perfscan guesses from names. Omit the whole field to
# keep PS6087 silent. The guard must be a positive, zero-argument method on the
# same operation provider. All three configured operations must return fresh
# nonaliasing outputs. The capability must match the composition, overwrite
# operand 0, preserve operand 1, and leave both unchanged when returning false.
inPlaceFusionContracts:
  - name: swiglu-eager
    producer: example.com/project/tensor.Linear.Forward
    activation: example.com/project/backend.Executor.SiLU
    activationInputArg: 0
    binary: example.com/project/backend.Executor.Mul
    binaryActivationArg: 0
    binaryOtherArg: 1
    capabilityInterface: example.com/project/backend.SwiGLUInPlaceFuser
    capabilityMethod: FuseSwiGLUInPlace
    nonRecordingGuard: example.com/project/backend.Executor.IsEager
    producerReturnsFreshOwned: true
    activationReturnsFreshOwned: true
    binaryReturnsFreshOwned: true
    capabilityOverwritesFirstArg: true
    capabilityPreservesSecondArg: true
    capabilityRejectsUnsupported: true
    capabilityFailureUnmodified: true
    capabilityMatchesComposition: true
    guardProvesNonRecording: true

# Exact API contracts for PS6106 bounded scratch-flow candidates. Positions
# are one-based and exclude the method receiver. These methods must resolve on
# the same concrete provider instance. Configured workload values supplement
# dynamic source extents but do not equate distinct runtime arguments. Omit
# replacement and all replacement promises to receive only the generic remedy.
boundedScratchFlowContracts:
  - name: bounded-activation
    allocator: example.com/project/backend.Device.Alloc
    allocatorCapacityArg: 1
    producer: example.com/project/backend.Device.Produce
    producerBufferArg: 1
    producerActiveArg: 2
    consumer: example.com/project/backend.Device.Activate
    consumerBufferArg: 1
    observers:
      - function: example.com/project/backend.Device.Observe
        bufferArg: 1
        activeArg: 2
    configuredCapacityElements: 1024
    configuredActiveElements: 16
    configuredRepeatCount: 12
    allocatorReturnsFreshOwned: true
    producerWritesOnlyActivePrefix: true
    consumerTraversesFullCapacity: true
    observersReadOnlyActivePrefix: true
    callsDoNotRetainBuffer: true
    callsExecuteSynchronously: true
    inactiveTailNotRequired: true
    replacement: example.com/project/backend.Device.ActivateN
    replacementMatchesComposition: true
    replacementPreservesActivePrefixBits: true
    replacementLeavesInactiveTail: true
    replacementPreservesErrorsSideEffects: true
    replacementPreservesProviderFallback: true
    replacementRejectsUnsupported: true
    replacementFailureUnmodified: true

# Exact ownership contracts for PS6107 receiver-owned high-water staging.
# Names do not imply semantics: every boolean is an explicit project promise.
# The optional overwrite entry supports one exact row-tiling source shape; omit
# it only when the candidate method itself has a canonical whole-slice `=` loop.
# maxRetainedBytes is a recommendation ceiling (and must be <= 64 MiB), not a
# claim that retaining that amount is safe for every application.
receiverStagingContracts:
  - name: decoder-prefill-upload
    candidateMethod: example.com/project/decoder.Decoder.prefill
    overwrite: example.com/project/decoder.Decoder.gatherInto
    overwriteKind: method
    overwriteArg: 0
    consumer: example.com/project/device.Buffer.UploadF32
    consumerKind: method
    consumerArg: 0
    lifecycleMethod: example.com/project/decoder.Decoder.Release
    maxRetainedBytes: 65536
    receiverCallsSequential: true
    overwriteWritesAllBeforeRead: true
    overwriteCompletesBeforeReturn: true
    overwriteDoesNotRetainArgument: true
    overwriteAccessesOnlyArgumentLength: true
    overwriteIgnoresCapacityAndIdentity: true
    overwritePreservesExtentInputs: true
    extentIsNonNegativeAndNonOverflowing: true
    consumerCompletesBeforeReturn: true
    consumerDoesNotRetainArgument: true
    lifecycleEndsReceiverUse: true
    contentsMayPersistUntilLifecycle: true
# Exact lifecycle contracts for PS6109 reusable Go shells around always-fresh
# one-shot native handles. Every identity is typed and every boolean is a
# project-owned semantic promise; names such as New/Reset/Free prove nothing.
reusableOneShotWrapperContracts:
  - name: recorder-shell
    wrapperType: example.com/project/backend.Recorder
    providerType: example.com/project/backend.Device
    acquisition: example.com/project/model.CommandFactory.NewRecorder
    concreteAcquisition: example.com/project/backend.Device.NewRecorder
    wrapperConstructor: example.com/project/backend.NewRecorder
    terminal: {static: example.com/project/model.CommandRecorder.Free, concrete: example.com/project/backend.Recorder.Free}
    reset: {static: example.com/project/model.CommandRecorder.Reset, concrete: example.com/project/backend.Recorder.Reset}
    freshNativeHandleFactory: example.com/project/backend.Device.NewCommandBuffer
    nativeHandleField: example.com/project/backend.Recorder.commandBuffer
    mutableStateFields: [example.com/project/backend.Recorder.encoder, example.com/project/backend.Recorder.committed]
    allowedSynchronousUses:
      - {static: example.com/project/model.CommandRecorder.Encode, concrete: example.com/project/backend.Recorder.Encode}
    acquisitionWrapperResult: 1
    acquisitionStatusResult: 2
    constructorWrapperResult: 1
    resetStatusResult: 1
    acquisitionFailureMode: nil-error
    resetFailureState: error-leaves-empty-terminal-safe
    slotBound: 1
    acquisitionCreatesFreshGoWrapper: true
    acquisitionHasExactDynamicWrapper: true
    failedAcquisitionHasNoGeneration: true
    nativeHandleIsOneShot: true
    resetAlwaysCreatesFreshHandle: true
    terminalSynchronouslyReleases: true
    terminalClearsHandle: true
    terminalIsIdempotent: true
    resetClearsMutableState: true
    usesExecuteSynchronously: true
    usesDoNotRetainGeneration: true
    noStaleGenerationReferences: true
    ownerAccessIsNonConcurrent: true
    providerFallbackIsPreserved: true
    failuresAndPanicsArePreserved: true

# Exact allocation-wrapper/caller-owned-output contracts for PS6111 dynamic
# reusable-result loops. Positions are one-based and exclude the receiver.
# shapeArgumentPositions must list every wrapper argument that may change the
# result length; an empty list means length depends only on the same concrete
# receiver. The configured workload pair labels an evidence model only and
# never proves source loop bounds or runtime shape.
reusableResultLoopContracts:
  - name: decoder-step-logits
    wrapper: example.com/project/decoder.Decoder.Step
    into: example.com/project/decoder.Decoder.StepInto
    resultPosition: 1
    destinationArgument: 3
    shapeArgumentPositions: []
    configuredResultElements: 50257
    configuredLoopIterations: 8
    wrapperReturnsFreshOwned: true
    resultLengthStableForReceiverAndListedArgs: true
    intoOverwritesDestinationOnSuccess: true
    intoDoesNotReadDestinationBeforeOverwrite: true
    intoIgnoresDestinationIdentityAndExtraCapacity: true
    intoDoesNotRetainDestination: true
    intoExecutesSynchronously: true
    wrapperAndIntoHaveIdenticalStateEffects: true
    wrapperAndIntoHaveIdenticalErrorsAndPanics: true

# Exact projection/recorder contracts for PS6113 direct residual-add fusion
# candidates. Positions are one-based and exclude method receivers. This
# example models record(r, src, scratch, rows), Binary(dst, scratch, dst, add),
# and recordAdd(r, src, scratch, dst, rows, len(dst)). Interface dispatch is
# accepted only at configuredSite and only when implementations enumerates the
# complete runtime set for that site. These are strong project-owned promises;
# identifier spelling proves none of them. Bias-bearing three-operation chains
# are outside PS6113 v1.
recorderResidualAddContracts:
  - name: decoder-attention-output-residual
    projection: example.com/project/model.Linear.record
    accumulate: example.com/project/model.Linear.recordAdd
    recorderBinary: example.com/project/backend.Recorder.Binary
    eagerSequence: example.com/project/model.firstErr
    addOperation: example.com/project/backend.BinaryAdd
    addOperationValue: "1"
    configuredSite: example.com/project/model.Decoder.Step
    projectionRecorderArgument: 1
    projectionSourceArgument: 2
    projectionTemporaryArgument: 3
    projectionExtentArguments: [4]
    binaryDestinationArgument: 1
    binaryTemporaryArgument: 2
    binaryOutputArgument: 3
    binaryOperationArgument: 4
    accumulateRecorderArgument: 1
    accumulateSourceArgument: 2
    accumulateTemporaryArgument: 3
    accumulateDestinationArgument: 4
    accumulateExtentArguments: [5]
    accumulateDestinationLengthArgument: 6
    implementations:
      - projection: example.com/project/model.F32Linear.record
        accumulate: example.com/project/model.F32Linear.recordAdd
      - projection: example.com/project/model.QuantLinear.record
        accumulate: example.com/project/model.QuantLinear.recordAdd
    projectionOverwritesTemporary: true
    temporaryMayServeAsAccumulateScratch: true
    matchedBuffersDoNotAlias: true
    temporaryUnobservedOutsideMatchedCalls: true
    callsDoNotRetainArguments: true
    callsExecuteSynchronously: true
    recorderOrderPreserved: true
    accumulateMatchesProjectionAndResidualAdd: true
    accumulatePreservesErrorsAndPanics: true
    accumulatePreservesPartialOutput: true
    accumulatePreservesArithmeticPolicy: true
    accumulateSupportsConfiguredDTypesLayoutsBackends: true
    allDynamicProjectionTypesCovered: true
    eagerSequenceReturnsFirstError: true

# Exact row-local-transform / regular sparse-gather contract for PS6114.
# Positions are one-based and exclude receivers. The contract, not names,
# supplies ownership, row-locality, differentiation, arithmetic, and backend
# fallback semantics. existingFusedCapabilityFallback: true deliberately
# suppresses a site that already has the reviewed forward+backward capability
# branch and equivalent fallback.
rowLocalSparseGatherContracts:
  - name: vit-selected-first-classifier
    configuredSite: example.com/project/vision.ViT.Forward
    transform: example.com/project/nn.LayerNorm.Forward
    gather: example.com/project/vision.sliceOne
    concat: example.com/project/backend.Execute
    sliceOperation: example.com/project/backend.OpSlice
    sliceOperationValue: "1"
    concatOperation: example.com/project/backend.OpConcat
    concatOperationValue: "2"
    sliceAttrsType: example.com/project/backend.SliceAttrs
    sliceAxisField: example.com/project/backend.SliceAttrs.Axis
    sliceStartField: example.com/project/backend.SliceAttrs.Start
    sliceEndField: example.com/project/backend.SliceAttrs.End
    concatAttrsType: example.com/project/backend.ConcatAttrs
    concatAxisField: example.com/project/backend.ConcatAttrs.Axis
    transformInputArgument: 2
    gatherOperationArgument: 2
    gatherAttrsArgument: 3
    gatherInputArgument: 4
    concatOperationArgument: 2
    concatCollectionArgument: 3
    concatAttrsArgument: 4
    configuredEvidence: apple-m2-pro-b8-s65-d128-c10
    packedRowsEqualBatchTimesStride: true
    batchPositive: true
    strideGreaterThanOne: true
    nativeIntArithmeticNoOverflow: true
    transformRowsIndependent: true
    transformPreservesRowOrderAndWidth: true
    transformParametersImmutable: true
    transformDoesNotMutateInput: true
    transformInputOutputDoNotAlias: true
    transformDoesNotRetainArguments: true
    callsExecuteSynchronously: true
    discardedRowsHaveNoEffectsStateOrRNG: true
    gatherDeterministicAndValueIndependent: true
    gatherAndConcatDoNotMutateOrRetain: true
    selectedFirstEquivalent: true
    fusedForwardParity: true
    floatingPointPolicyPreserved: true
    errorAndPanicParity: true
    partialOutputParity: true
    recorderOrderParity: true
    vjpAllInputGradientsParity: true
    supportedDTypesLayoutsBackends: true
    equivalentFallbackUnlessForwardAndBackwardAvailable: true

