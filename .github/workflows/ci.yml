name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Build + race-test each module independently, across OSes and Go versions.
  test:
    strategy:
      fail-fast: false
      matrix:
        module: [perfscan, perfscanxx]
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable, oldstable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  # Shared quality gates for BOTH modules: formatting, vet, staticcheck.
  quality:
    strategy:
      fail-fast: false
      matrix:
        module: [perfscan, perfscanxx]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          # analysistest fixtures under testdata/ need exact // want anchoring
          # (single-line loops etc.) that gofmt would break, so exclude them.
          out=$(gofmt -l . | grep -v /testdata/ || true)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: staticcheck
        working-directory: ${{ matrix.module }}
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...

  # perfscan-specific gates: generated docs, plugin module, benchmarks, dogfood.
  perfscan-extras:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: perfscan
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: docs up to date
        run: |
          go run ./gendocs
          git diff --exit-code docs/checks/
      - name: golangci-lint plugin module builds
        run: cd plugin && go build ./...
      - name: micro-benchmarks compile and run once
        run: go test -run '^$' -bench . -benchtime=1x ./benchmarks/
      - name: perfscan on perfscan (dogfood ratchet: fail on NEW self-findings)
        run: go run . -level 3 -baseline .perfscan-baseline.yaml ./...
