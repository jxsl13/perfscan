name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable, oldstable]
        shard: [0, 1]
        exclude:
          - os: ubuntu-latest
            shard: 1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - name: Build
        if: matrix.shard == 0
        run: go build ./...
      - name: Test in parallel
        # Analyzer tests spawn nested Go builds. Four race-enabled processes
        # oversubscribe the smaller macOS arm64 runner and make every checks
        # shard hit its timeout; two still run tests concurrently without the
        # pathological contention. Linux and Windows retain four workers.
        # Only the slower macOS and Windows dimensions use external runners;
        # Linux retains one complete run. Stable name hashing keeps the two
        # package-qualified selections disjoint even if list order differs.
        run: go run ./internal/testparallel -race -workers ${{ runner.os == 'macOS' && 2 || 4 }} -shard-index ${{ matrix.shard }} -shard-count ${{ matrix.os == 'ubuntu-latest' && 1 || 2 }} ./...

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: gofmt
        run: |
          # analysistest fixtures under testdata/ need exact // want anchoring
          # (single-line loops etc.) that gofmt would break, so exclude them.
          out=$(gofmt -l . | grep -v /testdata/ || true)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Set up oldstable Go for staticcheck
        # staticcheck 2026.1 cannot decode Go 1.27 export data yet. Build,
        # race tests, formatting, and vet above still use stable Go.
        uses: actions/setup-go@v7
        with:
          go-version: oldstable
          cache-dependency-path: go.sum
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...

  extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: docs up to date
        run: |
          go run ./gendocs
          git diff --exit-code docs/checks/
      - name: golangci-lint plugin builds
        run: go build ./plugin/...
      - name: micro-benchmarks compile and run once
        run: go test -run '^$' -bench . -benchtime=1x ./benchmarks/
      - name: 'perfscan on perfscan (dogfood ratchet: fail on NEW self-findings)'
        run: go run . -level 3 -baseline .perfscan-baseline.yaml ./...
