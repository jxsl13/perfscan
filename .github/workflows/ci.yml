name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable, oldstable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - name: Build
        run: go build ./...
      - name: Test in parallel
        run: go run ./internal/testparallel -race -workers 2 ./...

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: gofmt
        run: |
          # analysistest fixtures under testdata/ need exact // want anchoring
          # (single-line loops etc.) that gofmt would break, so exclude them.
          out=$(gofmt -l . | grep -v /testdata/ || true)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Set up oldstable Go for staticcheck
        # staticcheck 2026.1 cannot decode Go 1.27 export data yet. Build,
        # race tests, formatting, and vet above still use stable Go.
        uses: actions/setup-go@v7
        with:
          go-version: oldstable
          cache-dependency-path: go.sum
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...

  extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: docs up to date
        run: |
          go run ./gendocs
          git diff --exit-code docs/checks/
      - name: golangci-lint plugin builds
        run: go build ./plugin/...
      - name: micro-benchmarks compile and run once
        run: go test -run '^$' -bench . -benchtime=1x ./benchmarks/
      - name: 'perfscan on perfscan (dogfood ratchet: fail on NEW self-findings)'
        run: go run . -level 3 -baseline .perfscan-baseline.yaml ./...
