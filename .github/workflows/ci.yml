name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Keep the full matrix for the latest main commit and each independent PR.
# Superseded commits must not hold runners needed by their replacements.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable, oldstable]
        shard: [0, 1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
          scope: test-${{ matrix.shard }}
      - name: Build
        if: matrix.shard == 0
        run: go build ./...
      - name: Test in parallel
        # Analyzer tests spawn nested Go builds. Four race-enabled processes
        # oversubscribe the smaller macOS arm64 runner and make every checks
        # shard hit its timeout; two still run tests concurrently without the
        # pathological contention. Linux and Windows retain four workers.
        # Every platform uses two external runners. Stable name hashing keeps
        # the package-qualified selections disjoint and exhaustive even if
        # independently discovered test-list order differs.
        run: go run ./internal/testparallel -race -workers ${{ runner.os == 'macOS' && 2 || 4 }} -shard-index ${{ matrix.shard }} -shard-count 2 ./...

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version: stable
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
          scope: quality
      - name: gofmt
        run: |
          # analysistest fixtures under testdata/ need exact // want anchoring
          # (single-line loops etc.) that gofmt would break, so exclude them.
          out=$(gofmt -l . | grep -v /testdata/ || true)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Set up oldstable Go for staticcheck
        # staticcheck 2026.1 cannot decode Go 1.27 export data yet. Build,
        # race tests, formatting, and vet above still use stable Go.
        # The shared module cache was already restored. Only the separate
        # oldstable build directory is restored below, never the modules again.
        uses: actions/setup-go@v7
        id: go-staticcheck
        with:
          go-version: oldstable
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          go-version: ${{ steps.go-staticcheck.outputs.go-version }}
          scope: quality
          cache-modules: 'false'
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...

  extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version: stable
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
          scope: extras
      - name: docs up to date
        run: |
          go run ./gendocs
          git diff --exit-code docs/checks/
      - name: golangci-lint plugin builds
        run: go build ./plugin/...
      - name: micro-benchmarks compile and run once
        run: go test -run '^$' -bench . -benchtime=1x ./benchmarks/
      - name: 'perfscan on perfscan (dogfood ratchet: fail on NEW self-findings)'
        run: go run . -level 3 -baseline .perfscan-baseline.yaml ./...
