name: Release

# Releases use version-only tags at the repository root:
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be exactly vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
      - name: Build and archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          bin="perfscan"; [ "$GOOS" = "windows" ] && bin="perfscan.exe"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version}" -o "$bin" .
          name="perfscan_${version}_${GOOS}_${GOARCH}"
          mkdir -p out
          if [ "$GOOS" = "windows" ]; then
            zip -q "out/${name}.zip" "$bin"
          else
            tar czf "out/${name}.tar.gz" "$bin"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum ./* > perfscan_checksums.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
