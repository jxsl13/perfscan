name: Release

# One vX.Y.Z tag releases BOTH tools into a single GitHub release:
#   git tag v1.2.3 && git push --tags
# Each tool builds in its own module dir; assets are named perfscan_* and
# perfscanxx_* with per-tool checksum files.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    strategy:
      # Serialise: the first job creates the release, the second adds its
      # assets to it (both use goreleaser release.mode: keep-existing).
      max-parallel: 1
      matrix:
        module: [perfscan, perfscanxx]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Test ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: go test ./...
      - name: Release ${{ matrix.module }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
          workdir: ${{ matrix.module }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
