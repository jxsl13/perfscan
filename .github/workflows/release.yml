name: Release

# Each tool is a Go module in a subdirectory, so Go requires per-tool tag
# prefixes for versioned installs. Releasing is therefore per-tool:
#   git tag perfscan/v1.2.3   && git push origin perfscan/v1.2.3
#   git tag perfscanxx/v0.1.0 && git push origin perfscanxx/v0.1.0
# The tag prefix selects the module; the vX.Y.Z part is the version. A plain
# cross-compile matrix is used because GoReleaser's monorepo (prefixed-tag)
# support is Pro-only.
on:
  push:
    tags:
      - "perfscan/v*"
      - "perfscanxx/v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build and archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"       # e.g. perfscan/v1.2.3
          module="${tag%%/*}"            # perfscan | perfscanxx
          version="${tag##*/}"           # v1.2.3
          bin="$module"; [ "$GOOS" = "windows" ] && bin="$module.exe"
          go -C "$module" build -trimpath \
            -ldflags "-s -w -X main.version=${version}" -o "${GITHUB_WORKSPACE}/${bin}" .
          name="${module}_${version}_${GOOS}_${GOARCH}"
          mkdir -p out
          if [ "$GOOS" = "windows" ]; then
            zip -q "out/${name}.zip" "$bin"
          else
            tar czf "out/${name}.tar.gz" "$bin"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          module="${GITHUB_REF_NAME%%/*}"
          cd dist && sha256sum * > "${module}_checksums.txt"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
